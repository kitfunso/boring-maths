site:
  name: "Boring Math Calculators"
  url: "https://boring-math.com"
  handle: "@boringmath"  # Your X handle

generator:
  provider: "none"
  model: ""
  
  style:
    tone: "helpful and slightly witty"
    include_emoji: true
    max_hashtags: 2
    always_include_link: true

poster:
  min_hours_between_posts: 4
  
  schedule:
    - "09:00"
    - "14:00"
    - "19:00"
  
  days: [0, 1, 2, 3, 4]  # Weekdays only

monitor:
  keywords:
    - "fire calculator"
    - "retirement calculator"
    - "mortgage calculator"
    - "compound interest"
    - "tip calculator"
    - "how much paint"
    - "bmi calculator"
    - "uk tax trap"
    - "student loan calculator"
    - "baby cost"
    - "wedding alcohol"
    - "bbq calculator"
  
  check_interval: 15
  
  min_likes: 0
  min_retweets: 0
  
  min_follower_count: 10
  
  blacklist: []

rate_limits:
  max_posts_per_day: 10
  max_replies_per_hour: 5
  max_searches_per_15min: 15

logging:
  level: "INFO"
  file: "logs/x-bot.log"
